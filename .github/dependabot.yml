version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # mediapipe 0.10.21 is the last release with the mp.solutions API this project
    # uses, and it needs numpy<2 and protobuf<5. Remove these once the
    # Face Landmarker port (issue #36) is done.
    ignore:
      - dependency-name: mediapipe
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
      - dependency-name: protobuf
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
